<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scornade — compteur de points</title>
<meta name="description" content="Comptez les points de vos parties de belote, tarot, Yam's, fléchettes, mölkky et bien d'autres. Gratuit, sur téléphone comme sur ordinateur.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="canonical" href="https://jmprojectlab.fr/Scornade/">
<!-- Bannière Safari sur iPhone : propose d'ouvrir ou d'installer l'app. -->
<meta name="apple-itunes-app" content="app-id=6802812197">
<!-- Aperçu d'un lien partagé (WhatsApp, Messages, Facebook, LinkedIn…).
     Les adresses doivent être absolues : un réseau social ne résout pas un
     chemin relatif. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Scornade">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Scornade — compteur de points">
<meta property="og:description" content="Belote, coinche, tarot, Yam's, Mölkky et plus de 20 jeux. Les points se calculent tout seuls. Gratuit sur iPhone et sur le web.">
<meta property="og:url" content="https://jmprojectlab.fr/Scornade/">
<meta property="og:image" content="https://jmprojectlab.fr/Scornade/assets/img/partage.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Icône de Scornade : deux cartes à jouer et un signe plus">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="app" role="application" aria-label="Scornade">
  <div class="content"><p class="empty">Chargement…</p></div>
</div>

<dialog class="sheet" id="sheet" aria-label="Règles du jeu"></dialog>

<noscript>
  <div class="content">
    <p class="empty">Scornade a besoin de JavaScript pour compter les points.
    Activez-le dans votre navigateur, puis rechargez la page.</p>
  </div>
</noscript>

<script type="module">
  import { applyTheme, load, onChange, state } from "./assets/store.js";
  import { bindEvents, render, setAuth } from "./assets/ui.js";
  import { initFirebase } from "./assets/firebase.js";
  import { loadCachedCatalog } from "./assets/data.js";

  applyTheme();
  load();
  // Les corrections du catalogue déjà reçues s'appliquent avant le premier
  // rendu : pas de libellé qui change sous les yeux une seconde plus tard.
  loadCachedCatalog();
  bindEvents();
  onChange(render);
  // Firestore signale une correction arrivée en cours de route.
  state.onCatalogChange = render;
  render();

  // La synchronisation ne s'active que si une configuration Firebase existe.
  // Sinon le site reste en local, et c'est déjà pleinement utilisable.
  initFirebase()
    .then((api) => { if (api) { setAuth(api); render(); } })
    .catch(() => { /* hors ligne, ou SDK injoignable : on reste en local */ });

  // Fermer la feuille des règles au clic sur le fond.
  const sheet = document.getElementById("sheet");
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
</script>

</body>
</html>
