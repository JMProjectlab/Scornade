  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g filter="url(#bw)" fill="url(#wide)" opacity="1" transform="translate(512 540) scale(1.12) translate(-512 -540)">
  <g transform="translate(355 480) rotate(-12)"><rect x="-160" y="-220" width="320" height="440" rx="50"/></g>
  <g transform="translate(675 385) rotate(14)"><rect x="-150" y="-150" width="300" height="300" rx="68"/></g>
  <g transform="translate(640 725)"><circle r="170"/></g></g>
  <g filter="url(#bt)" fill="url(#tight)" opacity="0.9" transform="translate(512 540) scale(1.04) translate(-512 -540)">
  <g transform="translate(355 480) rotate(-12)"><rect x="-160" y="-220" width="320" height="440" rx="50"/></g>
  <g transform="translate(675 385) rotate(14)"><rect x="-150" y="-150" width="300" height="300" rx="68"/></g>
  <g transform="translate(640 725)"><circle r="170"/></g></g>
  <g transform="translate(355 480) rotate(-12)" filter="url(#sh)">
