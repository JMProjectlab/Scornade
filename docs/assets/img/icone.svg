<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B1D8F"/><stop offset="0.5" stop-color="#5B1A8C"/><stop offset="1" stop-color="#1A0B3D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.52" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FF6A00" stop-opacity="0.6"/><stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A00"/><stop offset="1" stop-color="#FF1F4B"/>
    </linearGradient>
    <linearGradient id="tight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD000"/><stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE14D"/><stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="bw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="bt" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <path id="heart" d="M0,-30 C-8,-58 -60,-58 -60,-18 C-60,14 -24,38 0,62 C24,38 60,14 60,-18 C60,-58 8,-58 0,-30 Z"/>
