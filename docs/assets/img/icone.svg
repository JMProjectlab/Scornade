<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1050" flood-opacity="0.35"/>
    </filter>
    <path id="heart" d="M0,-30 C-8,-58 -60,-58 -60,-18 C-60,14 -24,38 0,62 C24,38 60,14 60,-18 C60,-58 8,-58 0,-30 Z"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- cartes -->
    <g transform="translate(339 339)">
      <rect x="-155" y="-155" width="310" height="310" rx="78" fill="#FF5A5F"/>
      <use href="#heart" transform="scale(1.35)" fill="#fff"/>
    </g>
    <!-- dés -->
    <g transform="translate(685 339)">
      <rect x="-155" y="-155" width="310" height="310" rx="78" fill="#FFC83D"/>
      <g fill="#1D1D1F"><circle cx="-62" cy="-62" r="27"/><circle cx="0" cy="0" r="27"/><circle cx="62" cy="62" r="27"/></g>
    </g>
    <!-- adresse : cible -->
    <g transform="translate(339 685)">
      <rect x="-155" y="-155" width="310" height="310" rx="78" fill="#22C9A0"/>
      <circle r="92" fill="none" stroke="#fff" stroke-width="26"/>
      <circle r="42" fill="none" stroke="#fff" stroke-width="26"/>
      <circle r="10" fill="#fff"/>
    </g>
    <!-- le score -->
    <g transform="translate(685 685)">
      <rect x="-155" y="-155" width="310" height="310" rx="78" fill="#FFFFFF"/>
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="#4F46E5"/>
      <rect x="-22" y="-78" width="44" height="156" rx="22" fill="#4F46E5"/>
    </g>
  </g>
</svg>
