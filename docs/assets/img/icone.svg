    <use href="#heart" transform="scale(1.45)" fill="#FF2D55"/>
  </g>
  <g transform="translate(675 385) rotate(14)" filter="url(#sh)">
    <rect x="-150" y="-150" width="300" height="300" rx="68" fill="url(#sun)"/>
    <g fill="#140F2E"><circle cx="-64" cy="-64" r="27"/><circle cx="64" cy="-64" r="27"/><circle cx="0" cy="0" r="27"/><circle cx="-64" cy="64" r="27"/><circle cx="64" cy="64" r="27"/></g>
  </g>
  <g transform="translate(640 725)" filter="url(#sh)">
    <circle r="170" fill="#FFFFFF"/><circle r="118" fill="#140F2E"/><circle r="68" fill="#FFD000"/><circle r="26" fill="#FF2D55"/>
